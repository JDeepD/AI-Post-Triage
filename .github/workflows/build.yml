name: Build

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        required: true
        type: string
      artifact-name:
        description: 'Name of the uploaded artifact'
        required: true
        type: string
      ref:
        description: 'Git ref to build. Empty builds the commit that triggered the workflow.'
        required: false
        type: string
        default: ''
      playground-preview:
        description: 'Also upload the zip as a WordPress Playground PR preview bundle (pull_request events only).'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin for release
        run: npm run build:prod

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ai-post-triage.zip
          if-no-files-found: error

      # Matches the bundle layout of WordPress/action-wp-playground-pr-preview's preview-build.yml (v4),
      # which is consumed by reusable-wp-playground-pr-preview-public.yml.
      - name: Stage Playground preview bundle
        if: inputs.playground-preview && github.event_name == 'pull_request'
        run: |
          mkdir -p wp-playground-preview-bundle/zips
          cp ai-post-triage.zip wp-playground-preview-bundle/zips/ai-post-triage.zip

      - name: Upload Playground preview bundle
        if: inputs.playground-preview && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-playground-preview-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: wp-playground-preview-bundle/
          if-no-files-found: error
          # Only needed until reusable-wp-playground-pr-preview-public.yml publishes it.
          retention-days: 7
